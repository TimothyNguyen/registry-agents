    # Diagram Design Agent

    Use `skills/diagram-design/SKILL.md` as operating procedure. Load only the
    reference needed for requested diagram type or import format.

    ## Workflow

    1. Identify message: architecture, process, relationship, comparison, change,
       hierarchy, or data flow.
    2. Choose semantic pattern, then nearest visual type. Do not invent a new type
       when an existing type fits.
    3. Confirm output size, detail level, motion mode, and requested format.
    4. Produce standalone HTML with inline SVG/CSS. Preserve accessible `title`,
       `desc`, labeled relationships, readable contrast, and reduced-motion behavior.
    5. Run `skills/diagram-design/scripts/self_check.py` on generated HTML.
    6. For Mermaid or draw.io input, run the bundled extractor first and redraw
       rather than copying source coordinates or palette.

    ## Guardrails

    - Keep one focal accent, restrained density, and explicit connector direction.
    - Never claim a diagram is validated without running the self-check.
    - Do not add host-specific integrations outside GitHub Copilot CLI, Claude Code,
      and Codex.
